<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Advocate — tasks</title>
<!--
  The template of the tasks page. `nu tasks/tasks.nu html` replaces the
  TASKS marker with one section per state and writes `_site/index.html`;
  the workflow in `.github/workflows/pages.yml` publishes it. The bodies
  come already as HTML, rendered by cmark-gfm when the page is built: the
  script here only filters, and without it the page still reads.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfcfa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e2dd;
    --card: #ffffff; --accent: #2f6f4f; --code: #f2f0eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --fg: #e8e6e3; --muted: #9a9aa0; --line: #2c2c30;
      --card: #1e1e21; --accent: #7cc49f; --code: #26262a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 56rem; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  header p { margin: 0 0 1.5rem; color: var(--muted); }
  a { color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .filters button {
    font: inherit; font-size: .9rem; cursor: pointer;
    padding: .3rem .8rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .filters button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--bg);
  }
  .filters .count { opacity: .7; margin-left: .3rem; }
  .filters button.empty { opacity: .45; }
  #search {
    width: 100%; font: inherit; padding: .5rem .75rem; margin-bottom: 1.5rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--card); color: var(--fg);
  }
  section > h2 {
    font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 2rem 0 .5rem;
  }
  details.task {
    background: var(--card); border: 1px solid var(--line);
    border-radius: .5rem; margin-bottom: .5rem;
  }
  details.task > summary {
    cursor: pointer; padding: .6rem .9rem; list-style: none;
  }
  details.task > summary::-webkit-details-marker { display: none; }
  .type {
    display: inline-block; font-size: .75rem; padding: 0 .45rem;
    border-radius: .3rem; background: var(--code); color: var(--muted);
    margin-right: .4rem; vertical-align: .1em;
  }
  .name { font-weight: 600; }
  .desc { display: block; color: var(--muted); font-size: .9rem; margin-top: .15rem; }
  .meta { color: var(--muted); font-size: .8rem; padding: 0 .9rem; }
  .body { padding: .25rem .9rem .9rem; overflow-wrap: anywhere; }
  .body code, .body pre { background: var(--code); border-radius: .25rem; }
  .body code { padding: 0 .25rem; font-size: .9em; }
  .body pre { padding: .6rem; overflow-x: auto; }
  .body pre code { padding: 0; }
  .body table { border-collapse: collapse; }
  .body th, .body td { border: 1px solid var(--line); padding: .2rem .5rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>The Advocate — tasks</h1>
  <p>Where the work on <a href="https://github.com/lautarodragan/the-advocate">The Advocate</a> was left, built from
    <a href="https://github.com/lautarodragan/the-advocate-work/tree/main/tasks"><code>tasks/</code></a>.</p>
</header>

<nav class="filters" id="filters" aria-label="Filter by status"></nav>
<nav class="filters" id="types" aria-label="Filter by type"></nav>
<input id="search" type="search" placeholder="Filter by text…" aria-label="Filter by text">

<main id="tasks">
<!-- TASKS -->
</main>

<script>
  const sections = [...document.querySelectorAll('#tasks section')];
  const tasks = [...document.querySelectorAll('details.task')];
  const filters = document.getElementById('filters');
  const types = document.getElementById('types');
  const search = document.getElementById('search');
  const params = new URLSearchParams(location.search);
  let status = params.get('status') || 'all';
  let type = params.get('type') || 'all';

  // The counts are counted here, from what the build put in the page.
  const states = [['all', tasks.length], ...sections.map(s => [s.dataset.status, s.querySelectorAll('details.task').length])];
  for (const [name, count] of states) {
    const b = document.createElement('button');
    b.dataset.status = name;
    b.innerHTML = `${name}<span class="count">${count}</span>`;
    b.onclick = () => { status = name; apply(); };
    filters.append(b);
  }

  // The types, most used first over every task —an order that does not
  // jump around when the status changes—; their counts are of the chosen
  // status, and apply() writes them. The states' counts stay the totals.
  const byType = {};
  for (const t of tasks) byType[t.dataset.type] = (byType[t.dataset.type] || 0) + 1;
  const typeList = [['all', tasks.length], ...Object.entries(byType).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))];
  for (const [name, count] of typeList) {
    const b = document.createElement('button');
    b.dataset.type = name;
    b.innerHTML = `${name}<span class="count">${count}</span>`;
    b.onclick = () => { type = name; apply(); };
    types.append(b);
  }

  function apply() {
    const q = search.value.trim().toLowerCase();
    for (const b of filters.children) b.setAttribute('aria-pressed', b.dataset.status === status);
    for (const b of types.children) b.setAttribute('aria-pressed', b.dataset.type === type);
    const inStatus = tasks.filter(t => status === 'all' || t.dataset.status === status);
    for (const b of types.children) {
      const n = b.dataset.type === 'all' ? inStatus.length : inStatus.filter(t => t.dataset.type === b.dataset.type).length;
      b.querySelector('.count').textContent = n;
      b.classList.toggle('empty', n === 0);
    }
    for (const t of tasks) {
      const okStatus = status === 'all' || t.dataset.status === status;
      const okType = type === 'all' || t.dataset.type === type;
      const okText = !q || t.textContent.toLowerCase().includes(q);
      t.hidden = !(okStatus && okType && okText);
    }
    for (const s of sections) s.hidden = !s.querySelector('details.task:not([hidden])');
    const url = new URL(location);
    status === 'all' ? url.searchParams.delete('status') : url.searchParams.set('status', status);
    type === 'all' ? url.searchParams.delete('type') : url.searchParams.set('type', type);
    history.replaceState(null, '', url);
  }
  search.oninput = apply;

  function openHash() {
    const t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!t) return;
    status = 'all'; type = 'all'; search.value = ''; apply();
    t.open = true; t.scrollIntoView();
  }
  window.addEventListener('hashchange', openHash);
  apply();
  openHash();
</script>
</body>
</html>
