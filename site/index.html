<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Advocate — tasks</title>
<link rel="icon" type="image/png" href="favicon.png">
<!--
  The template of the tasks page. `nu tasks/tasks.nu html` replaces the
  FILTERS marker with the filter buttons and the TASKS marker with one
  section per state, already filtered as with no filter in the URL, and
  writes `_site/index.html`; the workflow in `.github/workflows/pages.yml`
  publishes it. The bodies come already as HTML, rendered by cmark-gfm
  when the page is built, but as the text of a script tag that the script
  here makes HTML when a task is opened (see `task_html` in tasks.nu for
  why). Without a script, every task's summary shows —by the rule in the
  noscript— but no body: GitHub has the files.
-->
<noscript><style>section[hidden], details.task[hidden] { display: block !important; } .filters, #search { display: none; }</style></noscript>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfcfa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e2dd;
    --card: #ffffff; --accent: #2f6f4f; --code: #f2f0eb;
    --quote-bar: #b9cfc2; --quote-bg: #f4f7f4; --log-bg: #f5f5f7;
    --mark: #f6dd7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --fg: #e8e6e3; --muted: #9a9aa0; --line: #2c2c30;
      --card: #1e1e21; --accent: #7cc49f; --code: #26262a;
      --quote-bar: #3d5a4b; --quote-bg: #1b2320; --log-bg: #19191c;
      --mark: #6b5a17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 56rem; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  header p { margin: 0 0 1.5rem; color: var(--muted); }
  a { color: var(--accent); }
  /* Each row of buttons stays on one line and scrolls sideways (taro's,
     2026-11-25): wrapped, the rows of games and authors grew to several
     lines and pushed the list down. */
  .filters {
    display: flex; flex-wrap: nowrap; gap: .5rem; margin-bottom: .75rem;
    overflow-x: auto; scrollbar-width: thin; padding-bottom: .25rem;
  }
  .filters button { flex: none; white-space: nowrap; }
  .filters button {
    font: inherit; font-size: .9rem; cursor: pointer;
    padding: .3rem .8rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  .filters button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--bg);
  }
  .filters .count { opacity: .7; margin-left: .3rem; }
  .filters button.empty { opacity: .45; }
  /* The search's matches (the script's `marks`). */
  ::highlight(search) { background-color: var(--mark); color: var(--fg); }
  #search {
    width: 100%; font: inherit; padding: .5rem .75rem; margin-bottom: 1.5rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--card); color: var(--fg);
  }
  section > h2 {
    font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 2rem 0 .5rem;
  }
  details.task {
    background: var(--card); border: 1px solid var(--line);
    border-radius: .5rem; margin-bottom: .5rem;
  }
  details.task > summary {
    cursor: pointer; padding: .6rem .9rem; list-style: none;
  }
  details.task > summary::-webkit-details-marker { display: none; }
  .type {
    display: inline-block; font-size: .75rem; padding: 0 .45rem;
    border-radius: .3rem; background: var(--code); color: var(--muted);
    margin-right: .4rem; vertical-align: .1em;
  }
  /* The game where the task was seen and has to be played to close it:
     the type's shape, in the accent, so the two read apart. */
  .game {
    display: inline-block; font-size: .75rem; padding: 0 .45rem;
    border-radius: .3rem; margin-right: .4rem; vertical-align: .1em;
    border: 1px solid var(--quote-bar); background: var(--quote-bg); color: var(--accent);
  }
  /* An inline block, so that when the name does not fit after the pills it
     goes whole to the next line instead of leaving its first words beside
     them (taro, on a phone). */
  .name { font-weight: 600; display: inline-block; }
  .desc { display: block; color: var(--muted); font-size: .9rem; margin-top: .15rem; }
  .meta { color: var(--muted); font-size: .8rem; padding: 0 .9rem; }
  .body { padding: .25rem .9rem .9rem; overflow-wrap: anywhere; }
  .body code, .body pre { background: var(--code); border-radius: .25rem; }
  .body code { padding: 0 .25rem; font-size: .9em; }
  .body pre { padding: .6rem; overflow-x: auto; }
  .body pre code { padding: 0; }
  /* taro's words go in a quote block (the README's rule): set apart the
     way Markdown quotes usually are, in the page's green. */
  .body blockquote {
    margin: .75rem 0; padding: .45rem .9rem;
    border-left: 3px solid var(--quote-bar); border-radius: 0 .3rem .3rem 0;
    background: var(--quote-bg); color: var(--fg);
  }
  .body blockquote > :first-child { margin-top: 0; }
  .body blockquote > :last-child { margin-bottom: 0; }
  /* A task's images (README: "Images"): small, in a row that wraps, and
     each a link to the whole image. Pixelated, because most are captures
     of a 256x224 screen and smoothing them blurs what they show. */
  .body p:has(> a.shot) { display: flex; flex-wrap: wrap; gap: .5rem; }
  .body a.shot img {
    display: block; height: 7.5rem; width: auto; max-width: 100%;
    image-rendering: pixelated; border: 1px solid var(--line); border-radius: .25rem;
  }
  /* A task's log (README, "A task's log"): its history, folded and closed,
     in a box of its own with a scroll of its own, so that a long history
     does not push the next task a screen away. A shade off the card, and
     the page's font: it is prose, not code. */
  details.log { margin-top: 1rem; }
  details.log > summary {
    cursor: pointer; color: var(--muted); font-size: .9rem; padding: .2rem 0;
  }
  .log-body {
    max-height: 20em; overflow-y: auto;
    margin-top: .4rem; padding: .25rem .9rem;
    background: var(--log-bg); border: 1px solid var(--line); border-radius: .4rem;
  }
  .log-body h3 { font-size: 1rem; margin: 1rem 0 .35rem; }
  /* The button that closes an open task, at its end, on the right: on the
     line of a folded log's summary, or under an open log. */
  .fold-row { display: flex; justify-content: flex-end; margin-top: .5rem; }
  .body > details.log:not([open]) + .fold-row { margin-top: -1.85rem; }
  .fold-row button {
    font: inherit; font-size: .85rem; cursor: pointer; color: var(--muted);
    padding: .1rem .7rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
  }
  .log-body h4 { font-size: .95rem; }
  /* A task's typed links (README, "A task's frontmatter"), before its
     log: the relation on the left, and each task with a pill of its state,
     so that whether what blocks it is done reads at a glance. */
  .links h2 { font-size: 1rem; margin: 1rem 0 .35rem; }
  .links dl {
    display: grid; grid-template-columns: max-content 1fr; gap: .2rem .9rem; margin: 0;
  }
  .links dt { color: var(--muted); font-size: .9rem; }
  .links dd { margin: 0; }
  .links ul { list-style: none; margin: 0; padding: 0; }
  .links .status {
    display: inline-block; font-size: .75rem; padding: 0 .45rem; margin-left: .3rem;
    border-radius: .3rem; background: var(--code); color: var(--muted); vertical-align: .1em;
  }
  .links .status[data-status="done"] { background: var(--quote-bg); color: var(--accent); }
  .links .status[data-status="cancelled"] { text-decoration: line-through; }
  .links .missing { color: var(--muted); text-decoration: line-through; }
  @media (max-width: 30rem) { .links dl { grid-template-columns: 1fr; } }
  .body table { border-collapse: collapse; }
  .body th, .body td { border: 1px solid var(--line); padding: .2rem .5rem; }
  /* The copy button floats right in the summary, so that the name and the
     description keep their width. */
  .copy {
    float: right; margin-left: .5rem; cursor: pointer;
    font: inherit; font-size: .75rem; padding: .1rem .5rem;
    border: 1px solid var(--line); border-radius: .3rem;
    background: var(--code); color: var(--muted);
  }
  .copy:hover { color: var(--fg); }
  .copy.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  /* The select button floats right too, after copy in the markup, so it
     lands just left of it. The same look, and the accent while selected. */
  .pick {
    float: right; margin-left: .5rem; cursor: pointer;
    font: inherit; font-size: .75rem; padding: .1rem .5rem;
    border: 1px solid var(--line); border-radius: .3rem;
    background: var(--code); color: var(--muted);
  }
  .pick:hover { color: var(--fg); }
  .pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  /* The selection's bar, fixed at the bottom while anything is selected;
     the body gets room under the last task so the bar never covers it. */
  #selection {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: .75rem;
    padding: .6rem 1rem; background: var(--card);
    border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0, 0, 0, .08);
  }
  #selection button {
    font: inherit; font-size: .9rem; cursor: pointer;
    padding: .3rem .8rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  #selection button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  body.selecting { padding-bottom: 5rem; }
  [hidden] { display: none !important; }
  /* The URL asks for another filter than the one the page was built with:
     the list and the counts that depend on the state wait out of sight
     for the script, rather than show the default's and then jump. */
  .pending #tasks, .pending #types .count, .pending #games .count, .pending #authors .count { visibility: hidden; }
</style>
</head>
<body>
<header>
  <h1>The Advocate — tasks</h1>
  <p>Where the work on <a href="https://github.com/lautarodragan/the-advocate">The Advocate</a> was left, built from
    <a href="https://github.com/lautarodragan/the-advocate-work/tree/main/tasks"><code>tasks/</code></a>.</p>
</header>

<!-- FILTERS -->
<input id="search" type="search" placeholder="Filter by text…" aria-label="Filter by text">

<div id="selection" role="region" aria-label="Selected tasks" hidden>
  <span id="selection-count"></span>
  <button type="button" class="primary" id="copy-all">Copy all</button>
  <button type="button" id="clear-all">Clear</button>
</div>

<script>
  // Here and not at the end: the buttons answer from the first paint,
  // while the tasks are still arriving, and what needs every task waits
  // for DOMContentLoaded (`ready`). The build already filtered the page as
  // it is with no filter in the URL, and pressed that filter's buttons.
  const filters = document.getElementById('filters');
  const types = document.getElementById('types');
  const games = document.getElementById('games');
  const authors = document.getElementById('authors');
  const search = document.getElementById('search');
  const root = document.documentElement;
  const params = new URLSearchParams(location.search);
  // The default state is the first one with any task —`all` lags, so it
  // is not the default—, the one the build pressed; the URL leaves it out.
  const defaultStatus = filters.querySelector('[aria-pressed="true"]').dataset.status;
  let status = params.get('status') || defaultStatus;
  let type = params.get('type') || 'all';
  let game = params.get('game') || 'all';
  let author = params.get('author') || 'all';
  const rows = [[filters, 'status'], [types, 'type'], [games, 'game'], [authors, 'author']];
  const chosen = () => ({status, type, game, author});

  function press() {
    const c = chosen();
    for (const [nav, key] of rows) for (const b of nav.children) b.setAttribute('aria-pressed', b.dataset[key] === c[key]);
  }
  // Any other filter than the build's, or a task in the hash: the list in
  // the page is not the one to show, so it stays out of sight —and the
  // counts, which are the default state's— until every task is there and
  // apply() picks them. With the default, nothing waits.
  function pending() { press(); root.classList.add('pending'); }
  if (status !== defaultStatus || type !== 'all' || game !== 'all' || author !== 'all' || location.hash) pending();

  let tasks = null, sections = null;
  const update = () => tasks ? apply() : pending();
  for (const [nav, key] of rows) nav.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (key === 'status') status = b.dataset.status;
    else if (key === 'type') type = b.dataset.type;
    else if (key === 'game') game = b.dataset.game;
    else author = b.dataset.author;
    update();
  });
  search.oninput = update;

  // What the last pass chose, and the tasks it showed: a search that only
  // grows, with the same filters, can only keep some of those —each task
  // that holds the longer text holds the shorter—, so it looks at them
  // alone. The counts depend only on the state, and are redone only when
  // it changes.
  let last = null, visible = [];
  function apply() {
    const q = query();
    const was = last;
    last = {q, status, type, game, author};
    const narrowing = was && was.q && q.startsWith(was.q) && was.status === status
      && was.type === type && was.game === game && was.author === author;
    press();
    if (!was || was.status !== status) recount();
    const candidates = narrowing ? visible : tasks;
    visible = [];
    const shown = new Set();
    for (const t of candidates) {
      // The text is read the first time it is searched, and kept.
      const ok = (status === 'all' || t.status === status) && (type === 'all' || t.type === type)
        && (game === 'all' || (game === 'none' ? t.games.length === 0 : t.games.includes(game)))
        && (author === 'all' || (t.author || 'none') === author)
        && (!q || (t.text ??= textOf(t.el)).includes(q));
      // Only what changes is touched: a hidden that is set again still
      // costs the browser a look at the task.
      if (t.el.hidden === ok) t.el.hidden = !ok;
      if (ok) { shown.add(t.status); visible.push(t); }
    }
    for (const s of sections) s.hidden = !shown.has(s.dataset.status);
    root.classList.remove('pending');
    const url = new URL(location);
    status === defaultStatus ? url.searchParams.delete('status') : url.searchParams.set('status', status);
    type === 'all' ? url.searchParams.delete('type') : url.searchParams.set('type', type);
    game === 'all' ? url.searchParams.delete('game') : url.searchParams.set('game', game);
    author === 'all' ? url.searchParams.delete('author') : url.searchParams.set('author', author);
    history.replaceState(null, '', url);
    highlight(narrowing ? was.q : '');
  }

  // The counts of the types, games and authors, in the chosen state —the
  // states' own are the totals the build wrote—, in one pass.
  function recount() {
    const n = {type: {all: 0}, game: {all: 0, none: 0}, author: {all: 0, none: 0}};
    const add = (o, k) => o[k] = (o[k] || 0) + 1;
    for (const t of tasks) {
      if (status !== 'all' && t.status !== status) continue;
      n.type.all++; n.game.all++; n.author.all++;
      add(n.type, t.type);
      if (t.games.length === 0) n.game.none++;
      for (const g of t.games) add(n.game, g);
      add(n.author, t.author || 'none');
    }
    for (const [nav, key] of rows.slice(1)) for (const b of nav.children) {
      const c = n[key][b.dataset[key]] || 0;
      b.lastChild.textContent = c;
      b.classList.toggle('empty', c === 0);
    }
  }

  // The search's matches, painted with the CSS Custom Highlight API: a
  // range per match, and no element added to the text. Only what can be
  // seen is looked at —the shown tasks' summaries and the bodies already
  // opened; an unopened body is a script's text—, and a body is painted
  // when it opens. Without the API the search still filters.
  const marks = window.CSS?.highlights && window.Highlight ? new Highlight() : null;
  if (marks) CSS.highlights.set('search', marks);
  // The search, once it has three characters: fewer match nearly every
  // task and would only cost a pass and thousands of marks.
  const query = () => { const q = search.value.trim().toLowerCase(); return q.length < 3 ? '' : q; };
  // Each shown task's matches, as [text node, offset, the node's text in
  // lowercase], kept for the next search: when it only grows, every new
  // match starts where an old one did, so the old ones are checked and the
  // text is not walked again. That is why the matches are found
  // overlapping —"aab" in "aaab" starts inside the first "aa"—; painted,
  // two overlapping ranges are one mark.
  let hits = new Map();
  function find(el, q) {
    const found = [];
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: n => n.parentNode.nodeName === 'SCRIPT' ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    for (let n; (n = w.nextNode());) {
      const s = n.data.toLowerCase();
      for (let i = s.indexOf(q); i !== -1; i = s.indexOf(q, i + 1)) found.push([n, i, s]);
    }
    return found;
  }
  function paint(found, q) {
    for (const [n, i] of found) {
      // Lowercasing can change a text's length (İ); a match past the
      // node's end is skipped rather than thrown.
      if (i + q.length > n.length) continue;
      // A StaticRange, not a Range: a Range is live, and the browser
      // updates every one still alive —painted or waiting for the
      // collector— on each change to the page; with a search's thousands,
      // the filters' next pass went from 18 ms to 1.5 s with the CPU at 4x.
      marks.add(new StaticRange({startContainer: n, startOffset: i, endContainer: n, endOffset: i + q.length}));
    }
  }
  // `from` is the shorter search this one grows from, or empty.
  function highlight(from) {
    if (!marks || !tasks) return;
    marks.clear();
    const q = query(), old = hits;
    hits = new Map();
    if (!q) return;
    for (const t of visible) {
      const before = from && old.get(t.el);
      const found = before ? before.filter(([, i, s]) => s.startsWith(q, i)) : find(t.el, q);
      hits.set(t.el, found);
      paint(found, q);
    }
  }

  // A task's body comes as the text of a script the browser does not run
  // —parsing every body as elements is what held the page on a phone—,
  // and becomes HTML the first time the task is opened.
  const unopened = el => el.querySelector(':scope > script.body');
  document.addEventListener('toggle', e => {
    const b = e.target.open && e.target.matches?.('details.task') && unopened(e.target);
    if (!b) return;
    const d = document.createElement('div');
    d.className = 'body';
    d.innerHTML = b.textContent + '<div class="fold-row"><button type="button" class="fold" title="Close the task">close</button></div>';
    b.replaceWith(d);
    const q = marks && query();
    if (q && hits.has(e.target)) {
      const found = find(d, q);
      hits.get(e.target).push(...found);
      paint(found, q);
    }
  }, true);
  // The close button at a task's end folds it, and brings its summary back
  // into view if closing left the reader below it.
  document.addEventListener('click', e => {
    const b = e.target.closest('button.fold');
    if (!b) return;
    const t = b.closest('details.task');
    t.open = false;
    if (t.getBoundingClientRect().top < 0) t.scrollIntoView();
  });
  // What the search looks in: the task as it reads, its body too. An
  // unopened body is HTML in a string, so its tags and comments go and its
  // entities —cmark-gfm writes only these— come back as characters.
  const entities = {'&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"'};
  function textOf(el) {
    const b = unopened(el);
    if (!b) return el.textContent.toLowerCase();
    let s = '';
    for (const n of el.childNodes) if (n !== b) s += n.textContent;
    s += b.textContent.replace(/<!--[^]*?-->|<[^>]*>/g, '').replace(/&(?:amp|lt|gt|quot);/g, m => entities[m]);
    return s.toLowerCase();
  }

  function openHash() {
    const t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!t || !t.matches('details.task')) return;
    status = t.dataset.status; type = 'all'; game = 'all'; author = 'all'; search.value = ''; apply();
    t.open = true; t.scrollIntoView();
  }

  // The selection: the file names of the tasks picked with their select
  // button, in the order they were picked, to copy them at once —one per
  // line, as the copy button gives one—. It is kept in this browser's
  // localStorage so a reload does not lose it; without storage (a private
  // window) it just lives as long as the page.
  const STORE = 'tasks-selection';
  let selected = [];
  try { selected = JSON.parse(localStorage.getItem(STORE)) || []; } catch {}
  const bar = document.getElementById('selection');
  const count = document.getElementById('selection-count');
  const copyAll = document.getElementById('copy-all');
  // The build wrote every select button unpressed: only those of the
  // selection are touched, not the hundreds of the rest.
  function mark(id, on) {
    const b = document.getElementById(id)?.querySelector('button.pick');
    if (!b) return;
    b.setAttribute('aria-pressed', on);
    b.textContent = on ? 'selected' : 'select';
  }
  function showSelection() {
    bar.hidden = selected.length === 0;
    document.body.classList.toggle('selecting', selected.length > 0);
    count.textContent = `${selected.length} task${selected.length === 1 ? '' : 's'} selected`;
    try { localStorage.setItem(STORE, JSON.stringify(selected)); } catch {}
  }
  async function copy(button, text, label) {
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = 'copied'; button.classList.add('done');
    } catch {
      button.textContent = 'failed';
    }
    setTimeout(() => { button.textContent = label; button.classList.remove('done'); }, 1200);
  }
  copyAll.onclick = () => copy(copyAll, selected.join('\n'), 'Copy all');
  document.getElementById('clear-all').onclick = () => {
    for (const id of selected) mark(id, false);
    selected = []; showSelection();
  };

  // The copy and select buttons live inside the summary: preventDefault
  // keeps the click from also opening or closing the task.
  document.addEventListener('click', e => {
    const c = e.target.closest('button.copy');
    const p = e.target.closest('button.pick');
    if (!c && !p) return;
    e.preventDefault();
    if (c) { copy(c, c.dataset.copy, 'copy'); return; }
    const id = p.dataset.id;
    const on = !selected.includes(id);
    selected = on ? [...selected, id] : selected.filter(x => x !== id);
    mark(id, on); showSelection();
  });

  document.addEventListener('DOMContentLoaded', () => {
    sections = [...document.querySelectorAll('#tasks section')];
    // What the filters ask of each task, read once from its attributes.
    tasks = [...document.querySelectorAll('details.task')].map(el => ({
      el, status: el.dataset.status, type: el.dataset.type, author: el.dataset.author,
      games: (el.dataset.game || '').split(' ').filter(Boolean),
    }));
    const ids = new Set(tasks.map(t => t.el.id));
    selected = selected.filter(id => ids.has(id));     // a task renamed or gone
    for (const id of selected) mark(id, true);
    showSelection();
    // A search the browser restored on a reload counts as one typed.
    if (root.classList.contains('pending') || search.value.trim()) apply();
    openHash();
    window.addEventListener('hashchange', openHash);
  });
</script>

<main id="tasks">
<!-- TASKS -->
</main>
</body>
</html>
